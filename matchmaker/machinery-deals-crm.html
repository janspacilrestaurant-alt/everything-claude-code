function haversineKm(c1,c2){
  const R=6371,dLat=(c2.lat-c1.lat)*Math.PI/180,dLon=(c2.lon-c1.lon)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(c1.lat*Math.PI/180)*Math.cos(c2.lat*Math.PI/180)*Math.sin(dLon/2)**2;
  return Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
}

function calcCosts(deal,weightTon,machineValueK){
  const buyerC=COUNTRY_COORDS[deal.demand.country];
  const sellerC=COUNTRY_COORDS[deal.offer.sellerCountry||deal.demand.country];
  if(!buyerC||!sellerC)return null;
  const distKm=haversineKm(buyerC,sellerC);
  const valueEur=machineValueK*1000;
  const ratePerKmTon=weightTon<=2?1.8:weightTon<=8?1.4:weightTon<=25?1.1:0.9;
  const transport=Math.round(Math.max(800,distKm*weightTon*ratePerKmTon));
  const insurance=Math.round(valueEur*0.003);
  const bothEU=EU_COUNTRIES.includes(deal.demand.country)&&EU_COUNTRIES.includes(deal.offer.sellerCountry||"DE");
  const customs=bothEU?0:Math.round(valueEur*0.037);
  const installation=Math.round(valueEur*0.015+500);
  const docs=bothEU?350:950;
  const total=transport+insurance+customs+installation+docs;
  return{distKm,transport,insurance,customs,installation,docs,total,pctOfValue:((total/valueEur)*100).toFixed(1),bothEU};
}

function calcMatchScore(deal){
  let s=0;const c=deal.matchCriteria||{};
  if(c.brand)s+=25;if(c.specs)s+=30;
  if(c.year==="ok")s+=20;else if(c.year==="borderline")s+=10;
  if(c.budget==="ok")s+=15;else if(c.budget==="tight")s+=7;
  if(c.extras)s+=10;
  return Math.min(100,s);
}

// Net profit = broker commission on actual sale price (price preferred, fallback to budget midpoint)
function calcNetProfit(deal, commissionPct) {
  const price = deal.offer?.price || deal.demand.budgetMidK || 80;
  const net = Math.round(price * commissionPct / 100 * 10) / 10;
  const lo  = Math.round(price * 0.9 * commissionPct / 100 * 10) / 10;
  const hi  = Math.round(price * 1.1 * commissionPct / 100 * 10) / 10;
  return { net, lo, hi, formatted: `${lo}–${hi} k€`, mid: net, basePrice: price };
}

async function callClaude(prompt) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1000,
      system: `You are a machinery deal structuring assistant. Always respond with valid JSON only, no markdown, no extra text.`,
      messages: [{ role: "user", content: prompt }],
    }),
  });
  const data = await res.json();

  return JSON.parse(text.replace(/```json|```/g, "").trim());
}

    headers:{
      "apikey":cfg.key,
      "Authorization":`Bearer ${cfg.key}`,
      "Content-Type":"application/json",
      "Prefer":"resolution=merge-duplicates,return=minimal",
    },
    body:JSON.stringify([{ id:SYNC_ROW_ID, payload, updated_at:new Date().toISOString() }]),
  });

  return true;
}

async function cloudPull(cfg){
  const url = `${cfg.url}/rest/v1/deals_sync?id=eq.${SYNC_ROW_ID}&select=payload,updated_at`;
  const res = await fetch(url, {
    headers:{ "apikey":cfg.key, "Authorization":`Bearer ${cfg.key}` },
  });
  if(!res.ok) throw new Error(`Stažení selhalo (${res.status})`);
  const rows = await res.json();
  return rows[0] || null;

    "postedDate": "YYYY-MM-DD if a publish date is in the input, otherwise empty string"
  },
  "matchCriteria": {
    "brand": true/false,
    "specs": true/false,
    "year": "ok" or "borderline",
    "budget": "ok" or "tight",
    "extras": true/false
  },
  "profit": {
    "val": "X–Y k€",
    "base": "~Z k€"
  },
  "flags": ["flag1 ✓", "flag2 ✓"],
  "warnings": ["warning if any"]
}
`);
      setDemand(result.demand);
      setOffer(result.offer);
      setCriteria(result.matchCriteria);
      // store profit/flags for review
      setAiResult(result);
      if(result.segment) setSegment(result.segment);
      setAiStatus("done");
      setStep(3);
    } catch(e) {
      setAiStatus("error");
      setAiError("AI párování není dostupné (mimo prostředí Claude chybí přístup k API). Použij prosím manuální zadání.");
    }
  };

  const [aiResult, setAiResult] = useState(null);

  const validate = () => {
    if(!demand.title.trim()) return "Vyplň název poptávky.";
    if(!offer.title.trim()) return "Vyplň název nabídky.";
    const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if(demand.buyerEmail && !emailRe.test(demand.buyerEmail)) return "E-mail kupujícího nemá platný formát.";
    if(offer.sellerEmail && !emailRe.test(offer.sellerEmail)) return "E-mail prodávajícího nemá platný formát.";
    const urlOk = (u)=>!u || /^https?:\/\//i.test(u);
    if(!urlOk(demand.link)) return "Odkaz poptávky musí začínat http:// nebo https://";
    if(!urlOk(offer.link)) return "Odkaz nabídky musí začínat http:// nebo https://";
    return "";
  };

  const handleSave = () => {
    const err = validate();
    if(err){ setValidationError(err); return; }
    setValidationError("");
    if(isEdit){
      onSaveEdit(editDeal.id, { segment, matchCriteria:criteria, demand, offer });
      onClose();
      return;
    }
    const profitData = aiResult?.profit || { val:"5–15 k€", base:"~80 k€" };
    const newDeal = {
      id: "d" + Date.now(),
      status: "new",
      segment,
      matchCriteria: criteria,
      demand, offer,
      profit: profitData,
      flags: aiResult?.flags || [],
      warnings: aiResult?.warnings || [],
      notes: "",
      emails: { buyer: null, seller: null },
      createdAt: new Date().toISOString(),
    };
    onAdd(newDeal);
    onClose();
  };

  const inputStyle = {
    width:"100%", fontSize:12, padding:"7px 10px", lineHeight:1.5,
    border:"0.5px solid var(--color-border-secondary)",
    borderRadius:"var(--border-radius-md)",
    background:"var(--color-background-secondary)",
    color:"var(--color-text-primary)",
  };
  const labelStyle = { fontSize:11, color:"var(--color-text-secondary)", marginBottom:4, display:"block" };
  const rowStyle   = { marginBottom:10 };

  return (
    <div className="ms-modal-overlay">
      <div className="ms-modal-box">

        {/* Header */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <div style={{fontSize:14,fontWeight:500,color:"var(--color-text-primary)"}}>{isEdit?"Upravit deal":"Přidat poptávku + spárovat nabídku"}</div>
          <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",fontSize:18,color:"var(--color-text-secondary)",padding:"0 4px"}}>×</button>
        </div>

        {/* Mode toggle */}
        {!isEdit && <div style={{display:"flex",gap:6,marginBottom:16}}>
          {[["manual","Manuálně"],["ai","AI — auto spárovat"]].map(([m,l])=>(
            <button key={m} onClick={()=>{setMode(m);setStep(m==="ai"?1:1);setAiStatus("idle");}} style={{
              fontSize:12,padding:"5px 14px",borderRadius:20,cursor:"pointer",
              border:mode===m?"1.5px solid #534AB7":"0.5px solid var(--color-border-secondary)",
              background:mode===m?"#EEEDFE":"transparent",
              color:mode===m?"#3C3489":"var(--color-text-secondary)",
              fontWeight:mode===m?500:400,
            }}>
              {m==="ai" && <i className="ti ti-sparkles" aria-hidden="true" style={{fontSize:12,marginRight:4}}/>}
              {l}
            </button>
          ))}
        </div>}

        {/* Segment picker */}
        <div style={{marginBottom:14}}>
          <div style={{fontSize:11,color:"var(--color-text-secondary)",marginBottom:5}}>Segment:</div>
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            {Object.entries(SEGMENTS).map(([key,cfg])=>(
              <button key={key} onClick={()=>setSegment(key)} style={{fontSize:11,padding:"5px 10px",borderRadius:20,cursor:"pointer",border:segment===key?`1.5px solid ${cfg.border}`:"0.5px solid var(--color-border-secondary)",background:segment===key?cfg.color:"transparent",color:segment===key?cfg.text:"var(--color-text-secondary)",fontWeight:segment===key?500:400,display:"flex",alignItems:"center",gap:4}}>
                <i className={"ti "+cfg.icon} aria-hidden="true" style={{fontSize:12}}/>{cfg.label}
              </button>
            ))}
          </div>
        </div>

        {/* ── AI MODE ── */}
        {mode==="ai" && step===1 && (
          <div>
            <div style={rowStyle}>
              <label style={labelStyle}>Vlož popis poptávky, link na Machineseeker nebo volný text</label>

                value={aiInput}

                placeholder={"Příklady:\n• https://www.machineseeker.com/cnc-fraeza/...\n• Hledám použitý soustruh CNC, max. 5 let starý, Česká republika, budget cca 40k€\n• Potřebujeme laserový řezač pro nerez, Slovensko, Trumpf nebo Bystronic"}

            </div>
            {aiStatus==="error" && (
              <div style={{fontSize:11,padding:"6px 10px",background:"#FCEBEB",color:"#791F1F",borderRadius:"var(--border-radius-md)",border:"0.5px solid #F7C1C1",marginBottom:10}}>

            <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:4}}>
              <button onClick={onClose} style={{fontSize:12,padding:"6px 14px",borderRadius:"var(--border-radius-md)",border:"0.5px solid var(--color-border-secondary)",background:"transparent",cursor:"pointer",color:"var(--color-text-primary)"}}>Zrušit</button>

            {(step===1||mode==="ai") && (

                <div className="ms-grid-2" style={{...rowStyle}}>
                  <div>
                    <label style={labelStyle}>Kupující (firma / typ)</label>
                    <input style={inputStyle} value={demand.buyer} onChange={e=>D("buyer",e.target.value)} placeholder="Výrobní firma CZ" />
                  </div>
                  <div>
                    <label style={labelStyle}>Země kupujícího</label>

                    <label style={labelStyle}>Budget (text)</label>

                </div>
                <div className="ms-grid-2" style={{...rowStyle}}>
                  <div>
                    <label style={labelStyle}>E-mail prodávajícího</label>

                  </div>
                  <div>
                    <label style={labelStyle}>Telefon</label>
                    <input style={inputStyle} value={offer.sellerPhone} onChange={e=>O("sellerPhone",e.target.value)} placeholder="+49 ..." />

                  <div>

                <div style={rowStyle}>

                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:14}}>
                  {[
                    {k:"brand",label:"Značka odpovídá",pts:25,type:"bool"},

                              <button key={v} onClick={()=>C(c.k,v==="true")} style={{fontSize:11,padding:"3px 10px",borderRadius:20,cursor:"pointer",border:String(criteria[c.k])===v?`1.5px solid ${br}`:"0.5px solid var(--color-border-secondary)",background:String(criteria[c.k])===v?bg:"transparent",color:String(criteria[c.k])===v?col:"var(--color-text-secondary)",fontWeight:String(criteria[c.k])===v?500:400}}>{l}</button>
                            ))}
                          </div>
                        : <div style={{display:"flex",gap:4}}>
                            {c.opts.map(([v,l])=>(
                              <button key={v} onClick={()=>C(c.k,v)} style={{fontSize:11,padding:"3px 10px",borderRadius:20,cursor:"pointer",border:criteria[c.k]===v?"1.5px solid #C0DD97":"0.5px solid var(--color-border-secondary)",background:criteria[c.k]===v?"#EAF3DE":"transparent",color:criteria[c.k]===v?"#27500A":"var(--color-text-secondary)",fontWeight:criteria[c.k]===v?500:400}}>{l}</button>
                            ))}
                          </div>}
                    </div>
                  ))}
                  <div style={{padding:"8px 10px",border:`1.5px solid ${scoreColor(calcMatchScore({matchCriteria:criteria})).border}`,borderRadius:"var(--border-radius-md)",background:scoreColor(calcMatchScore({matchCriteria:criteria})).bg,display:"flex",alignItems:"center",justifyContent:"center"}}>
                    <div style={{textAlign:"center"}}>
                      <div style={{fontSize:10,color:scoreColor(calcMatchScore({matchCriteria:criteria})).text,marginBottom:2}}>Celková shoda</div>
                      <div style={{fontSize:24,fontWeight:500,color:scoreColor(calcMatchScore({matchCriteria:criteria})).text}}>{calcMatchScore({matchCriteria:criteria})} %</div>
                    </div>
                  </div>
                </div>
                {validationError && <div style={{fontSize:11,padding:"7px 11px",marginBottom:10,background:"#FCEBEB",color:"#791F1F",borderRadius:"var(--border-radius-md)",border:"0.5px solid #F7C1C1"}}><i className="ti ti-alert-triangle" aria-hidden="true" style={{fontSize:12,marginRight:5}}/>{validationError}</div>}
                <div style={{display:"flex",gap:6,justifyContent:"flex-end"}}>
                  {mode==="manual"&&!isEdit&&<button onClick={()=>setStep(2)} style={{fontSize:12,padding:"8px 14px",borderRadius:"var(--border-radius-md)",border:"0.5px solid var(--color-border-secondary)",background:"transparent",cursor:"pointer",color:"var(--color-text-secondary)"}}>← Zpět</button>}
                  {mode==="ai"&&<button onClick={()=>setStep(1)} style={{fontSize:12,padding:"8px 14px",borderRadius:"var(--border-radius-md)",border:"0.5px solid var(--color-border-secondary)",background:"transparent",cursor:"pointer",color:"var(--color-text-secondary)"}}>← Upravit</button>}
                  <button onClick={handleSave} style={{fontSize:12,padding:"8px 16px",borderRadius:"var(--border-radius-md)",border:"0.5px solid #639922",background:"#EAF3DE",cursor:"pointer",color:"#27500A",fontWeight:500,display:"flex",alignItems:"center",gap:5}}>
                    <i className={`ti ${isEdit?"ti-device-floppy":"ti-plus"}`} aria-hidden="true" style={{fontSize:13}}/>{isEdit?"Uložit změny":"Uložit deal"}
                  </button>
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

// ── Shared sub-components ──────────────────────────────────────────────────────
function MatchScore({deal}){
  const score=calcMatchScore(deal),col=scoreColor(score),segs=10,filled=Math.round(score/segs);
  return(
    <div style={{display:"flex",alignItems:"center",gap:7}}>
      <div style={{display:"flex",gap:2}}>
        {Array.from({length:segs}).map((_,i)=>(
          <div key={i} style={{width:14,height:7,borderRadius:2,background:i<filled?col.border:"var(--color-background-secondary)",border:`0.5px solid ${i<filled?col.border:"var(--color-border-tertiary)"}`}}/>
        ))}
      </div>
      <span style={{fontSize:12,fontWeight:500,padding:"2px 8px",borderRadius:"var(--border-radius-md)",background:col.bg,color:col.text,border:`0.5px solid ${col.border}`}}>{score} %</span>
    </div>
  );
}

function CostBreakdown({deal,onUpdate}){
  const [wi,setWi]=useState(deal.weightTier??1);
  const costs=calcCosts(deal,WEIGHT_TIERS[wi].val,deal.offer?.price||deal.demand.budgetMidK||80);
  if(!costs)return<div style={{fontSize:12,color:"var(--color-text-secondary)"}}>Nepodporovaná země.</div>;
  const rows=[
    {label:"Doprava",val:costs.transport,icon:"ti-truck"},
    {label:"Pojištění (0,3 % hodnoty)",val:costs.insurance,icon:"ti-shield"},
    {label:"Montáž + demontáž",val:costs.installation,icon:"ti-tool"},
    {label:"Dokumentace",val:costs.docs,icon:"ti-file-text"},
    ...(costs.customs>0?[{label:"Clo (HS84 ~3,7 %)",val:costs.customs,icon:"ti-building-bank",warn:true}]:[]),
  ];
  return(
    <div style={{marginTop:10}}>
      <div style={{fontSize:11,color:"var(--color-text-secondary)",marginBottom:8,display:"flex",alignItems:"center",gap:8}}>
        <i className="ti ti-route" aria-hidden="true" style={{fontSize:13}}/>
        Vzdálenost: <strong style={{color:"var(--color-text-primary)",fontWeight:500}}>{costs.distKm.toLocaleString("cs-CZ")} km</strong>
        {costs.bothEU&&<span style={{fontSize:10,padding:"1px 6px",background:"#E1F5EE",color:"#085041",borderRadius:10,border:"0.5px solid #9FE1CB"}}>EU — bez cla</span>}
      </div>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
        <span style={{fontSize:11,color:"var(--color-text-secondary)"}}>Hmotnost:</span>
        <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
          {WEIGHT_TIERS.map((t,i)=>(

const COUNTRY_LANG = {CZ:"CZ",SK:"SK",DE:"DE",AT:"AT",PL:"PL",HU:"EN",FR:"EN",IT:"EN",NL:"EN",BE:"EN",CH:"DE",ES:"EN",UK:"EN",SE:"EN",RO:"EN"};
const SIGNATURE = `Jan Spáčil\njan.spacil86@gmail.com`;

function getLang(country){ return LANG[COUNTRY_LANG[country]] || LANG.EN; }

function fmtNum(n,langKey){
  const locale = langKey==="CZ"||langKey==="SK"?"cs-CZ":langKey==="DE"||langKey==="AT"||langKey==="CH"?"de-DE":langKey==="PL"?"pl-PL":"en-GB";
  return n.toLocaleString(locale);
}

function generateEmail(type,deal,costs){
  const score = calcMatchScore(deal);
  const country = type==="buyer" ? deal.demand.country : (deal.offer.sellerCountry||"DE");
  const langKey = COUNTRY_LANG[country] || "EN";
  const L = LANG[langKey];
  const fmt = (n) => fmtNum(n, langKey);

  let costsLine = "";
  if(costs){
    const parts = [`${L.buyerTransport} ${fmt(costs.transport)} €`, `${L.buyerInsurance} ${fmt(costs.insurance)} €`];
    if(costs.customs > 0) parts.push(`${L.buyerCustoms} ${fmt(costs.customs)} €`);
    costsLine = `\n${L.buyerCosts} ${fmt(costs.total)} € (${parts.join(", ")}).`;
  }

  if(type==="buyer"){
    return [
      `${L.buyerSubject(deal.demand.title)}`,``,
      `${L.greeting}`,``,
      `${L.buyerIntro}`,``,
      `${L.buyerMachine}`,
      `${deal.offer.title}`,
      `${deal.offer.specs}`,``,
      `${L.buyerMatch} ${score} %${costsLine}`,``,
      `${L.buyerQuestion}`,``,
      `${L.buyerClosing}`,``,
      `${L.sign},`,
      SIGNATURE,
    ].join("\n");
  }

  return [
    `${L.sellerSubject(deal.offer.title)}`,``,
    `${L.greeting}`,``,
    `${L.sellerIntro}`,``,
    `${L.sellerMachine} ${deal.offer.title}`,
    `${deal.offer.specs}`,``,
    `${L.sellerQuestion}`,``,
    `${L.sellerCommission}`,``,
    `${L.sellerClosing}`,``,
    `${L.sign},`,
    SIGNATURE,
  ].join("\n");
}

function buildMailto(to, fullBody){
  const lines = fullBody.split("\n");
  const subject = lines[0] || "";
  const bodyText = lines.slice(1).join("\n").replace(/^\n+/, "");
  return `mailto:${to||""}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(bodyText)}`;
}

function PostedDate({date,color}){
  if(!date)return null;
  const d=new Date(date);
  if(isNaN(d))return null;
  const days=Math.floor((Date.now()-d.getTime())/86400000);
  const ageLabel = days<=0?"dnes":days===1?"včera":days<30?`před ${days} dny`:days<60?"před měsícem":`před ${Math.floor(days/30)} měsíci`;
  const stale = days>=60;
  return (
    <div style={{display:"inline-flex",alignItems:"center",gap:3,fontSize:10,color:stale?"#854F0B":color,marginTop:2}}>
      <i className="ti ti-calendar-event" aria-hidden="true" style={{fontSize:10}}/>
      Zveřejněno {d.toLocaleDateString("cs-CZ")} · {ageLabel}{stale?" ⚠":""}
    </div>
  );
}

                style={{display:"inline-flex",alignItems:"center",gap:2,fontSize:10,padding:"2px 7px",borderRadius:20,textDecoration:"none",background:s.color,border:`0.5px solid ${s.border}`,color:s.text,whiteSpace:"nowrap"}}>
                {s.name} ↗
              </a>
            ))}
          </div>
        </div>
      </div>

      <div className="ms-summary" style={{borderBottom:expanded?"0.5px solid var(--color-border-tertiary)":"none"}}>
        <Badge status={deal.status}/>
        <SegmentBadge segment={deal.segment}/>
        <MatchScore deal={deal}/>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <div style={{background:"#EAF3DE",border:"0.5px solid #C0DD97",borderRadius:"var(--border-radius-md)",padding:"4px 10px",display:"flex",alignItems:"baseline",gap:5}}>
            <span style={{fontSize:18,fontWeight:500,color:"#27500A",letterSpacing:"-0.5px"}}>{netP.formatted}</span>
            <span style={{fontSize:10,color:"#3B6D11"}}>čistý zisk</span>
          </div>
          {editingComm
            ? <div style={{display:"flex",alignItems:"center",gap:4}}>
                <input type="number" min="1" max="30" step="0.5" value={commInput}
                  onChange={e=>{const val=e.target.value;setCommInput(val);const v=parseFloat(val);if(v>0&&v<=30)onCommissionChange(v);}}
                  onKeyDown={e=>{if(e.key==="Enter"||e.key==="Escape")setEditingComm(false);}}
                  autoFocus
                  style={{width:52,fontSize:12,padding:"3px 6px",borderRadius:"var(--border-radius-md)",border:"1.5px solid #534AB7",background:"var(--color-background-primary)",color:"var(--color-text-primary)",textAlign:"center"}}
                />
                <span style={{fontSize:11,color:"var(--color-text-secondary)"}}>%</span>
                <button onClick={()=>setEditingComm(false)} style={{fontSize:10,padding:"3px 8px",borderRadius:"var(--border-radius-md)",border:"0.5px solid #639922",background:"#EAF3DE",cursor:"pointer",color:"#27500A"}}>OK</button>
              </div>
            : <button onClick={()=>{setCommInput(String(commission));setEditingComm(true);}} title="Změnit provizi" style={{fontSize:11,padding:"3px 9px",borderRadius:"var(--border-radius-md)",border:"0.5px solid var(--color-border-secondary)",background:"transparent",cursor:"pointer",color:"var(--color-text-secondary)",display:"flex",alignItems:"center",gap:3}}>
                <i className="ti ti-percentage" aria-hidden="true" style={{fontSize:12}}/>{commission} %
              </button>
          }
        </div>
        <div style={{display:"flex",flexWrap:"wrap",gap:3,flex:1}}>
          {deal.flags.map(f=><span key={f} style={{fontSize:10,padding:"2px 6px",borderRadius:"var(--border-radius-md)",background:"#EAF3DE",color:"#3B6D11",border:"0.5px solid #C0DD97"}}>{f}</span>)}
          {deal.warnings.map(w=><span key={w} style={{fontSize:10,padding:"2px 6px",borderRadius:"var(--border-radius-md)",background:"#FAEEDA",color:"#854F0B",border:"0.5px solid #FAC775"}}>{w}</span>)}
        </div>
        <button onClick={()=>setExpanded(!expanded)} style={{fontSize:11,padding:"4px 10px",borderRadius:"var(--border-radius-md)",border:"0.5px solid var(--color-border-secondary)",background:"transparent",cursor:"pointer",color:"var(--color-text-secondary)"}}>
          {expanded?"Skrýt ↑":"Detail ↓"}
        </button>
      </div>

      {expanded&&(
        <div style={{padding:"12px 14px"}}>
          <div style={{marginBottom:14}}>
            <div style={{fontSize:11,color:"var(--color-text-secondary)",marginBottom:6,fontWeight:500}}>Hledat na evropských platformách</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
              {buildSourceLinks(deal.offer.searchQuery||deal.offer.title).map(s=>(
                <a key={s.id} href={s.href} target="_blank" rel="noopener noreferrer"
                  style={{display:"inline-flex",alignItems:"center",gap:3,fontSize:11,padding:"4px 10px",borderRadius:20,textDecoration:"none",background:s.color,border:`0.5px solid ${s.border}`,color:s.text}}>
                  {s.name} ↗
                </a>
              ))}
            </div>
          </div>
          <div className="ms-grid-2" style={{marginBottom:14}}>
            <div style={{padding:"8px 11px",background:"#EEEDFE",borderRadius:"var(--border-radius-md)",border:"0.5px solid #CECBF6"}}>
              <div style={{fontSize:10,fontWeight:500,color:"#534AB7",marginBottom:4,letterSpacing:".03em"}}>KONTAKT — KUPUJÍCÍ</div>
              <div style={{fontSize:11,color:"#3C3489"}}>{deal.demand.buyer||"—"}</div>
              {deal.demand.buyerEmail
                ? <a href={`mailto:${deal.demand.buyerEmail}`} style={{fontSize:11,color:"#534AB7",textDecoration:"none",display:"block",marginTop:2}}>✉ {deal.demand.buyerEmail}</a>
                : <div style={{fontSize:11,color:"#854F0B",marginTop:2}}>⚠ bez e-mailu</div>}
              {deal.demand.buyerPhone && <a href={`tel:${deal.demand.buyerPhone}`} style={{fontSize:11,color:"#534AB7",textDecoration:"none",display:"block",marginTop:1}}>☎ {deal.demand.buyerPhone}</a>}
            </div>
            <div style={{padding:"8px 11px",background:"#E1F5EE",borderRadius:"var(--border-radius-md)",border:"0.5px solid #9FE1CB"}}>
              <div style={{fontSize:10,fontWeight:500,color:"#0F6E56",marginBottom:4,letterSpacing:".03em"}}>KONTAKT — PRODÁVAJÍCÍ</div>
              <div style={{fontSize:11,color:"#085041"}}>{deal.offer.seller||"—"}{deal.offer.price?` · ${deal.offer.price} k€`:""}</div>
              {deal.offer.sellerEmail
                ? <a href={`mailto:${deal.offer.sellerEmail}`} style={{fontSize:11,color:"#0F6E56",textDecoration:"none",display:"block",marginTop:2}}>✉ {deal.offer.sellerEmail}</a>
                : <div style={{fontSize:11,color:"#854F0B",marginTop:2}}>⚠ bez e-mailu</div>}
              {deal.offer.sellerPhone && <a href={`tel:${deal.offer.sellerPhone}`} style={{fontSize:11,color:"#0F6E56",textDecoration:"none",display:"block",marginTop:1}}>☎ {deal.offer.sellerPhone}</a>}
            </div>
          </div>
          <div style={{marginBottom:14}}>
            <div style={{fontSize:11,color:"var(--color-text-secondary)",marginBottom:6,fontWeight:500}}>Shoda kritérií</div>
            <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
              {[{k:"brand",l:"Značka",p:25},{k:"specs",l:"Specifikace",p:30},{k:"year",l:"Rok",p:20,multi:true},{k:"budget",l:"Budget",p:15,multi:true},{k:"extras",l:"Extras",p:10}].map(c=>{
                const val=deal.matchCriteria[c.k];const ok=val===true||val==="ok";const partial=val==="borderline"||val==="tight";
                return(<div key={c.k} style={{fontSize:11,padding:"3px 9px",borderRadius:"var(--border-radius-md)",border:`0.5px solid ${ok?"#C0DD97":partial?"#FAC775":"var(--color-border-tertiary)"}`,background:ok?"#EAF3DE":partial?"#FAEEDA":"var(--color-background-secondary)",color:ok?"#27500A":partial?"#854F0B":"var(--color-text-secondary)",display:"flex",alignItems:"center",gap:4}}>
                  <span>{ok?"✓":partial?"~":"✗"}</span><span>{c.l}</span><span style={{opacity:.6,fontSize:10}}>{c.p}b.</span>
                </div>);
              })}
              <div style={{fontSize:11,padding:"3px 9px",borderRadius:"var(--border-radius-md)",border:`1.5px solid ${col.border}`,background:col.bg,color:col.text,fontWeight:500}}>= {calcMatchScore(deal)} / 100</div>
            </div>
          </div>

          <div style={{marginBottom:14}}>
            <div style={{fontSize:11,color:"var(--color-text-secondary)",marginBottom:2,fontWeight:500,display:"flex",alignItems:"center",gap:5}}>
              <i className="ti ti-calculator" aria-hidden="true" style={{fontSize:13}}/>Kalkulace logistiky
            </div>
            <CostBreakdown deal={deal} onUpdate={onUpdate}/>
          </div>

          <div style={{fontSize:12,color:"var(--color-text-secondary)",marginBottom:10}}>
            <i className="ti ti-mail" aria-hidden="true" style={{fontSize:13,marginRight:5}}/>
            {deal.emails.buyer?<span style={{color:"#639922"}}>Kupující osloven {new Date(deal.emails.buyer).toLocaleDateString("cs-CZ")}</span>:<span>Kupující — neosloven</span>}
            {" · "}
            {deal.emails.seller?<span style={{color:"#639922"}}>Prodávající osloven {new Date(deal.emails.seller).toLocaleDateString("cs-CZ")}</span>:<span>Prodávající — neosloven</span>}
          </div>

          <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
            <button onClick={()=>setEmailModal("buyer")} style={{fontSize:12,padding:"6px 12px",borderRadius:"var(--border-radius-md)",border:"0.5px solid #AFA9EC",background:"#EEEDFE",cursor:"pointer",color:"#3C3489",display:"flex",alignItems:"center",gap:5}}>
              <i className="ti ti-mail" aria-hidden="true" style={{fontSize:13}}/> Oslovi kupujícího
            </button>
            <button onClick={()=>setEmailModal("seller")} style={{fontSize:12,padding:"6px 12px",borderRadius:"var(--border-radius-md)",border:"0.5px solid #9FE1CB",background:"#E1F5EE",cursor:"pointer",color:"#085041",display:"flex",alignItems:"center",gap:5}}>
              <i className="ti ti-mail" aria-hidden="true" style={{fontSize:13}}/> Oslovi prodávajícího
            </button>
          </div>

          <div style={{marginBottom:12}}>
            <div style={{fontSize:11,color:"var(--color-text-secondary)",marginBottom:5}}>Status dealu:</div>
            <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
              {Object.entries(STATUS_CONFIG).map(([key,cfg])=>(
                <button key={key} onClick={()=>onUpdate(deal.id,{status:key})} style={{fontSize:11,padding:"3px 10px",borderRadius:20,border:deal.status===key?`1.5px solid ${cfg.dot}`:"0.5px solid var(--color-border-secondary)",background:deal.status===key?cfg.color:"transparent",color:deal.status===key?cfg.text:"var(--color-text-secondary)",cursor:"pointer",fontWeight:deal.status===key?500:400,transition:"all .15s"}}>{cfg.label}</button>
              ))}
            </div>
          </div>

          <div style={{marginBottom:12}}>
            <div style={{fontSize:11,color:"var(--color-text-secondary)",marginBottom:5}}>Poznámky:</div>
            <textarea value={notes} onChange={e=>setNotes(e.target.value)} onBlur={()=>onUpdate(deal.id,{notes})} placeholder="Přidej poznámku k dealu..." style={{width:"100%",minHeight:65,fontSize:12,padding:"8px 10px",lineHeight:1.5,border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)",background:"var(--color-background-secondary)",color:"var(--color-text-primary)",resize:"vertical"}}/>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",borderTop:"0.5px solid var(--color-border-tertiary)",paddingTop:10,gap:8,flexWrap:"wrap"}}>
            <span style={{fontSize:10,color:"var(--color-text-tertiary)"}}>Vytvořeno {new Date(deal.createdAt).toLocaleDateString("cs-CZ")}</span>
            <div style={{display:"flex",gap:6}}>
              <button onClick={()=>onEdit(deal)} style={{fontSize:11,padding:"6px 12px",borderRadius:"var(--border-radius-md)",border:"0.5px solid var(--color-border-secondary)",background:"transparent",cursor:"pointer",color:"var(--color-text-primary)",display:"flex",alignItems:"center",gap:4}}>
                <i className="ti ti-edit" aria-hidden="true" style={{fontSize:12}}/>Upravit
              </button>
              <button onClick={()=>{if(confirm(`Smazat deal "${deal.demand.title}"?`))onDelete(deal.id);}} style={{fontSize:11,padding:"6px 12px",borderRadius:"var(--border-radius-md)",border:"0.5px solid #F7C1C1",background:"transparent",cursor:"pointer",color:"#791F1F",display:"flex",alignItems:"center",gap:4}}>
                <i className="ti ti-trash" aria-hidden="true" style={{fontSize:12}}/>Smazat
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── App ────────────────────────────────────────────────────────────────────────
function ResponsiveStyles(){
  return (
    <style>{`
      .ms-app { padding: 1rem; max-width: 920px; margin: 0 auto; }
      .ms-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 1000; overflow-y: auto; }
      .ms-modal-box { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.25rem; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; }
      .ms-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .ms-card-header { display: grid; grid-template-columns: 1fr 1fr; }
      .ms-summary { padding: 9px 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .ms-header-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      .ms-tap { min-height: 32px; }
      @media (max-width: 560px) {
        .ms-app { padding: 0.75rem 0.6rem; }
        .ms-grid-2 { grid-template-columns: 1fr; }
        .ms-card-header { grid-template-columns: 1fr; }
        .ms-card-header > div { border-right: none !important; }
        .ms-modal-box { padding: 1rem; max-height: 92vh; }
        .ms-modal-overlay { padding: 8px; align-items: flex-start; }
        .ms-header-actions { width: 100%; }
        .ms-header-actions button, .ms-header-actions label { flex: 1; justify-content: center; min-height: 40px; }
        .ms-tap { min-height: 40px; }
        .ms-stat-grid { grid-template-columns: 1fr 1fr !important; }
      }
      @media (max-width: 380px) {
        .ms-stat-grid { grid-template-columns: 1fr !important; }
      }
    `}</style>
  );
}

function App(){
  const [deals,setDeals]=useState(()=>{try{const s=localStorage.getItem(DEALS_KEY);return s?JSON.parse(s):initialDeals;}catch{return initialDeals;}});
  const [commission,setCommission]=useState(()=>{ try{const v=localStorage.getItem("ms_commission");return v?parseFloat(v):5;}catch{return 5;}});
  const [filter,setFilter]=useState("all");
  const [segFilter,setSegFilter]=useState("all");
  const [search,setSearch]=useState("");
  const [sortBy,setSortBy]=useState("date");
  const [showAdd,setShowAdd]=useState(false);
  const [editDeal,setEditDeal]=useState(null);
  const [storageNote,setStorageNote]=useState("");

  const handleCommissionChange = (v) => {
    setCommission(v);
    try{localStorage.setItem("ms_commission",String(v));}catch{}
  };

  const snapRef = React.useRef(false);
  useEffect(()=>{
    try{
      localStorage.setItem(DEALS_KEY,JSON.stringify(deals));
      if(snapRef.current){
        const snapRaw=localStorage.getItem("ms_snapshots");
        const snaps=snapRaw?JSON.parse(snapRaw):[];
        snaps.unshift({at:new Date().toISOString(),count:deals.length,data:deals});
        localStorage.setItem("ms_snapshots",JSON.stringify(snaps.slice(0,3)));
      } else { snapRef.current=true; }
    }catch{setStorageNote("Data se neukládají (incognito nebo blokované úložiště)");}
  }, [deals]);

  const [showBackupHint,setShowBackupHint]=useState(false);
  const [showSync,setShowSync]=useState(false);
  const [syncCfg,setSyncCfg]=useState(()=>getSyncConfig());
  const [syncStatus,setSyncStatus]=useState("idle"); // idle | syncing | ok | error
  const [lastSync,setLastSync]=useState(null);
  const mountedRef = React.useRef(false);
  const changeRef = React.useRef(0);
  useEffect(()=>{
    if(!mountedRef.current){ mountedRef.current=true; return; }
    changeRef.current+=1;
    if(changeRef.current%15===0) setShowBackupHint(true);
  }, [deals]);

  // Auto-push to cloud (debounced 2s) when configured
  const syncTimerRef = React.useRef(null);
  const firstSyncRef = React.useRef(false);
  useEffect(()=>{
    if(!syncCfg) return;
    if(!firstSyncRef.current){ firstSyncRef.current=true; return; }
    clearTimeout(syncTimerRef.current);
    syncTimerRef.current=setTimeout(async()=>{
      setSyncStatus("syncing");
      try{ await cloudPush(syncCfg,{deals,commission,updatedAt:new Date().toISOString()});
        setSyncStatus("ok"); setLastSync(new Date()); }
      catch{ setSyncStatus("error"); }
    },2000);
    return ()=>clearTimeout(syncTimerRef.current);
  }, [deals,commission,syncCfg]);

  const handlePull=(payload)=>{
    if(payload?.deals) setDeals(payload.deals);
    if(payload?.commission) handleCommissionChange(payload.commission);
    setLastSync(new Date());
  };

  const updateDeal=useCallback((id,patch)=>{setDeals(prev=>prev.map(d=>d.id===id?{...d,...patch}:d));},[]);
  const addDeal=useCallback((deal)=>{setDeals(prev=>[deal,...prev]);},[]);
  const saveEdit=useCallback((id,patch)=>{setDeals(prev=>prev.map(d=>d.id===id?{...d,...patch}:d));setEditDeal(null);},[]);
  const openEdit=useCallback((deal)=>{setEditDeal(deal);setShowAdd(true);},[]);
  const deleteDeal=useCallback((id)=>{setDeals(prev=>prev.filter(d=>d.id!==id));},[]);

  const exportData=()=>{
    const blob=new Blob([JSON.stringify({deals,commission,exportedAt:new Date().toISOString()},null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=`machinery-deals-${new Date().toISOString().slice(0,10)}.json`;a.click();
    URL.revokeObjectURL(url);
  };
  const importData=(e)=>{
    const file=e.target.files?.[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(Array.isArray(data.deals)){setDeals(data.deals);if(data.commission)handleCommissionChange(data.commission);}
        else if(Array.isArray(data)){setDeals(data);}
      }catch{alert("Neplatný soubor — očekávám JSON export.");}
    };
    reader.readAsText(file);e.target.value="";
  };

  let working = deals;
  if(segFilter!=="all") working=working.filter(d=>d.segment===segFilter);
  if(filter!=="all") working=working.filter(d=>d.status===filter);
  if(search.trim()){
    const q=search.toLowerCase();
    working=working.filter(d=>
      d.demand.title.toLowerCase().includes(q)||
      d.offer.title.toLowerCase().includes(q)||
      (d.demand.buyer||"").toLowerCase().includes(q)||
      (d.offer.seller||"").toLowerCase().includes(q)||
      (d.demand.country||"").toLowerCase().includes(q)||
      (d.offer.sellerCountry||"").toLowerCase().includes(q)||
      (SEGMENTS[d.segment]?.label||"").toLowerCase().includes(q)
    );
  }
  const filtered=[...working].sort((a,b)=>{
    if(sortBy==="profit")return calcNetProfit(b,commission).net-calcNetProfit(a,commission).net;
    if(sortBy==="score")return calcMatchScore(b)-calcMatchScore(a);
    return new Date(b.createdAt)-new Date(a.createdAt);
  });

  const totalNetMin=deals.filter(d=>d.status!=="lost").reduce((a,d)=>a+calcNetProfit(d,commission).lo,0);
  const totalNetMax=deals.filter(d=>d.status!=="lost").reduce((a,d)=>a+calcNetProfit(d,commission).hi,0);
  const avgScore=deals.length?Math.round(deals.reduce((a,d)=>a+calcMatchScore(d),0)/deals.length):0;

  return(
    <div className="ms-app" style={{fontFamily:"var(--font-sans)"}}>
      <ResponsiveStyles/>
      {showAdd&&<AddDealModal onClose={()=>{setShowAdd(false);setEditDeal(null);}} onAdd={addDeal} onSaveEdit={saveEdit} editDeal={editDeal}/>}
      {showSync&&<SyncModal onClose={()=>setShowSync(false)} onConfigSaved={setSyncCfg} onPull={handlePull} deals={deals} commission={commission}/>}

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"1.25rem",gap:10,flexWrap:"wrap"}}>
        <div>
          <div style={{fontSize:18,fontWeight:500,color:"var(--color-text-primary)"}}>Machinery Deals</div>
          <div style={{fontSize:12,color:"var(--color-text-secondary)",marginTop:2}}>Pipeline párovatelných strojů · {deals.length} dealů</div>
        </div>
        <div className="ms-header-actions">
          <button onClick={()=>setShowAdd(true)} style={{fontSize:12,padding:"6px 14px",borderRadius:"var(--border-radius-md)",border:"0.5px solid #534AB7",background:"#EEEDFE",cursor:"pointer",color:"#3C3489",fontWeight:500,display:"flex",alignItems:"center",gap:5}}>
            <i className="ti ti-plus" aria-hidden="true" style={{fontSize:13}}/> Přidat poptávku
          </button>
          <button onClick={exportData} title="Export dat (JSON)" style={{fontSize:11,padding:"6px 10px",borderRadius:"var(--border-radius-md)",border:"0.5px solid var(--color-border-secondary)",background:"transparent",cursor:"pointer",color:"var(--color-text-secondary)",display:"flex",alignItems:"center",gap:4}}>
            <i className="ti ti-download" aria-hidden="true" style={{fontSize:13}}/>Export
          </button>
          <label title="Import dat (JSON)" style={{fontSize:11,padding:"6px 10px",borderRadius:"var(--border-radius-md)",border:"0.5px solid var(--color-border-secondary)",background:"transparent",cursor:"pointer",color:"var(--color-text-secondary)",display:"flex",alignItems:"center",gap:4}}>
            <i className="ti ti-upload" aria-hidden="true" style={{fontSize:13}}/>Import
            <input type="file" accept="application/json,.json" onChange={importData} style={{display:"none"}}/>
          </label>
          <button onClick={()=>setShowSync(true)} title="Cloud sync" style={{fontSize:11,padding:"6px 10px",borderRadius:"var(--border-radius-md)",border:`0.5px solid ${syncCfg?"#9FE1CB":"var(--color-border-secondary)"}`,background:syncCfg?"#E1F5EE":"transparent",cursor:"pointer",color:syncCfg?"#085041":"var(--color-text-secondary)",display:"flex",alignItems:"center",gap:4}}>
            <i className={`ti ${syncStatus==="syncing"?"ti-cloud-cog":syncStatus==="ok"?"ti-cloud-check":syncStatus==="error"?"ti-cloud-x":"ti-cloud"}`} aria-hidden="true" style={{fontSize:13}}/>{syncCfg?"Cloud":"Cloud sync"}
          </button>
          <button onClick={()=>{if(deals.length>0&&confirm(`Smazat všech ${deals.length} dealů? Doporučuji nejprve Export.`))setDeals([]);}} style={{fontSize:11,padding:"5px 10px",borderRadius:"var(--border-radius-md)",border:"0.5px solid var(--color-border-secondary)",background:"transparent",cursor:"pointer",color:"var(--color-text-tertiary)"}}>Smazat vše</button>
        </div>
      </div>

      {storageNote&&<div style={{fontSize:11,padding:"6px 12px",marginBottom:12,background:"#FAEEDA",color:"#854F0B",borderRadius:"var(--border-radius-md)",border:"0.5px solid #FAC775"}}>{storageNote}</div>}
      {syncCfg&&<div style={{fontSize:10,color:"var(--color-text-tertiary)",marginBottom:10,display:"flex",alignItems:"center",gap:5}}>
        <i className={`ti ${syncStatus==="syncing"?"ti-cloud-cog":syncStatus==="error"?"ti-cloud-x":"ti-cloud-check"}`} aria-hidden="true" style={{fontSize:12,color:syncStatus==="error"?"#C0392B":syncStatus==="syncing"?"#BA7517":"#639922"}}/>
        {syncStatus==="syncing"?"Synchronizuji...":syncStatus==="error"?"Sync selhal — zkontroluj připojení":lastSync?`Synchronizováno ${lastSync.toLocaleTimeString("cs-CZ")}`:"Cloud připojen"}
      </div>}
      {showBackupHint&&<div style={{fontSize:11,padding:"8px 12px",marginBottom:12,background:"#E6F1FB",color:"#0C447C",borderRadius:"var(--border-radius-md)",border:"0.5px solid #B5D4F4",display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,flexWrap:"wrap"}}>
        <span><i className="ti ti-shield-check" aria-hidden="true" style={{fontSize:13,marginRight:5}}/>Doporučuji zálohu — udělal jsi řadu změn. Export uloží vše do souboru.</span>
        <span style={{display:"flex",gap:6}}>
          <button onClick={()=>{exportData();setShowBackupHint(false);}} style={{fontSize:11,padding:"4px 12px",borderRadius:"var(--border-radius-md)",border:"0.5px solid #378ADD",background:"#fff",cursor:"pointer",color:"#0C447C",fontWeight:500}}>Exportovat teď</button>
          <button onClick={()=>setShowBackupHint(false)} style={{fontSize:11,padding:"4px 10px",borderRadius:"var(--border-radius-md)",border:"0.5px solid var(--color-border-secondary)",background:"transparent",cursor:"pointer",color:"var(--color-text-secondary)"}}>Později</button>
        </span>
      </div>}

      <div className="ms-stat-grid" style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(100px,1fr))",gap:8,marginBottom:"1.25rem"}}>
        <StatCard label="Celkem dealů" value={deals.length}/>
        <StatCard label="Průměrná shoda" value={`${avgScore} %`} color={scoreColor(avgScore).text}/>
        <StatCard label="Osloveno" value={deals.filter(d=>d.status==="contacted").length} color="#BA7517"/>
        <StatCard label="Vyjednávání" value={deals.filter(d=>d.status==="negotiating").length} color="#534AB7"/>
        <StatCard label="Uzavřeno" value={deals.filter(d=>d.status==="closed").length} color="#3B6D11"/>
        <StatCard label="Čistý zisk pipeline" value={`${totalNetMin}–${totalNetMax} k€`} color="#27500A" sub={`při provizi ${commission} %`}/>
      </div>

      <div style={{display:"flex",gap:8,marginBottom:"0.75rem",flexWrap:"wrap",alignItems:"center"}}>
        <div style={{position:"relative",flex:1,minWidth:180}}>
          <i className="ti ti-search" aria-hidden="true" style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",fontSize:14,color:"var(--color-text-tertiary)"}}/>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Hledat stroj, firmu, zemi..." style={{width:"100%",fontSize:12,padding:"7px 10px 7px 32px",borderRadius:"var(--border-radius-md)",border:"0.5px solid var(--color-border-secondary)",background:"var(--color-background-secondary)",color:"var(--color-text-primary)"}}/>
        </div>
        <div style={{display:"flex",gap:4,alignItems:"center"}}>
          <span style={{fontSize:11,color:"var(--color-text-secondary)"}}>Řadit:</span>
          {[["date","Datum"],["profit","Zisk"],["score","Shoda"]].map(([k,l])=>(
            <button key={k} onClick={()=>setSortBy(k)} style={{fontSize:11,padding:"4px 10px",borderRadius:20,cursor:"pointer",border:sortBy===k?"1.5px solid #534AB7":"0.5px solid var(--color-border-secondary)",background:sortBy===k?"#EEEDFE":"transparent",color:sortBy===k?"#3C3489":"var(--color-text-secondary)",fontWeight:sortBy===k?500:400}}>{l}</button>
          ))}
        </div>
      </div>

      <div style={{display:"flex",gap:5,marginBottom:"0.5rem",flexWrap:"wrap"}}>
        <span style={{fontSize:11,color:"var(--color-text-secondary)",lineHeight:"28px"}}>Segment:</span>
        {[["all","Vše"],...Object.entries(SEGMENTS).map(([k,v])=>[k,v.label])].map(([key,label])=>{
          const count=key==="all"?deals.length:deals.filter(d=>d.segment===key).length;
          if(key!=="all"&&count===0) return null;
          const cfg=SEGMENTS[key];
          return(<button key={key} onClick={()=>setSegFilter(key)} style={{fontSize:11,padding:"4px 10px",borderRadius:20,border:segFilter===key?`1.5px solid ${cfg?.border||"var(--color-border-primary)"}`:"0.5px solid var(--color-border-secondary)",background:segFilter===key?(cfg?.color||"var(--color-background-secondary)"):"transparent",cursor:"pointer",color:segFilter===key?(cfg?.text||"var(--color-text-primary)"):"var(--color-text-secondary)",fontWeight:segFilter===key?500:400}}>{label}{count>0&&<span style={{opacity:.6}}> ({count})</span>}</button>);
        })}
      </div>
      <div style={{display:"flex",gap:6,marginBottom:"1rem",flexWrap:"wrap"}}>
        {[["all","Vše"],...Object.entries(STATUS_CONFIG).map(([k,v])=>[k,v.label])].map(([key,label])=>{
          const count=key==="all"?deals.length:deals.filter(d=>d.status===key).length;
          return(<button key={key} onClick={()=>setFilter(key)} style={{fontSize:11,padding:"4px 12px",borderRadius:20,border:filter===key?"1.5px solid var(--color-border-primary)":"0.5px solid var(--color-border-secondary)",background:filter===key?"var(--color-background-secondary)":"transparent",cursor:"pointer",color:"var(--color-text-primary)",fontWeight:filter===key?500:400}}>{label}{count>0&&<span style={{opacity:.6}}> ({count})</span>}</button>);
        })}
      </div>

      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {filtered.length===0&&(
          deals.length===0
            ? <div style={{textAlign:"center",padding:"2.5rem 1.5rem",color:"var(--color-text-secondary)"}}>
                <i className="ti ti-inbox" aria-hidden="true" style={{fontSize:34,opacity:0.4,display:"block",marginBottom:10}}/>
                <div style={{fontSize:14,fontWeight:500,color:"var(--color-text-primary)",marginBottom:4}}>Zatím žádné dealy</div>
                <div style={{fontSize:12,marginBottom:16}}>Přidej první poptávku a spáruj ji s nabídkou — ručně nebo přes AI.</div>
                <button onClick={()=>setShowAdd(true)} style={{fontSize:12,padding:"7px 16px",borderRadius:"var(--border-radius-md)",border:"0.5px solid #534AB7",background:"#EEEDFE",cursor:"pointer",color:"#3C3489",fontWeight:500,display:"inline-flex",alignItems:"center",gap:5}}>
                  <i className="ti ti-plus" aria-hidden="true" style={{fontSize:13}}/> Přidat poptávku
                </button>
              </div>
            : <div style={{textAlign:"center",padding:"2rem",color:"var(--color-text-secondary)",fontSize:13}}>{search?"Žádný deal neodpovídá hledání.":"Žádné dealy v tomto stavu."}</div>
        )}
        {filtered.map(deal=><DealCard key={deal.id} deal={deal} onUpdate={updateDeal} onDelete={deleteDeal} onEdit={openEdit} commission={commission} onCommissionChange={handleCommissionChange}/>)}
      </div>

      <div style={{marginTop:"1.5rem",padding:"10px 14px",background:"var(--color-background-secondary)",borderRadius:"var(--border-radius-md)",fontSize:11,color:"var(--color-text-secondary)"}}>
        Data v localStorage · Záloha: tlačítko Export (JSON) · Zisk = cena × provize · Pro produkci: Supabase / HubSpot API
      </div>
    </div>
  );
}


ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
